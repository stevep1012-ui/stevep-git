services:
  - type: web
    name: youtube-bird-studio
    env: docker
    dockerfilePath: ../Dockerfile

    # Pricing and resources (updated 2026-06-07)
    plan: standard
    region: oregon
    numInstances: 1

    # Port configuration
    envVars:
      - key: PORT
        value: 8000
      - key: HOST
        value: 0.0.0.0
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: youtube-bird-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: youtube-bird-cache
          type: redis
          property: connectionString

    # Health check (already in Dockerfile)
    healthCheckPath: /api/health

    # Auto-deploy on push
    autoDeploy: true

    # Build config
    buildCommand: pip install -r requirements.txt
    startCommand: python3 -m tools.youtube_healing.dashboard_server --host 0.0.0.0 --port 8000 --multi-user-root data/users --public-cloud

    # Disk for persistent data
    disk:
      - name: data
        mountPath: /app/data
        sizeGB: 10
      - name: outputs
        mountPath: /app/outputs
        sizeGB: 50
      - name: logs
        mountPath: /app/logs
        sizeGB: 5

  # PostgreSQL Database
  - type: pserv
    name: youtube-bird-db
    ipAllowList: [] # Only allow from web service
    plan: standard
    postgresVersion: 15
    initialDatabaseName: youtube_bird
    user: youtube_bird_user

    # Backups
    postgresDiskSizeGB: 100

  # Redis Cache
  - type: redis
    name: youtube-bird-cache
    ipAllowList: [] # Only allow from web service
    plan: standard
    maxmemoryPolicy: allkeys-lru

# Environment variables (secrets - use Render dashboard)
envVars:
  - key: SECRET_KEY
    sync: false  # Set manually in Render dashboard
  - key: SENTRY_DSN
    sync: false  # Set manually in Render dashboard
  # Auto-refresh trigger

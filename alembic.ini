[alembic]
# Database URL (override with environment variable)
sqlalchemy.url = sqlite:///./youtube_bird.db

# Path to migration scripts
script_location = alembic

# Template for migration filenames
file_template = %%(rev)s_%%(slug)s

# Enable auto-generation of migration scripts
# Can be false if using raw SQL migrations
autogenerate = true

# Logging configuration
sqlalchemy.echo = false
sqlalchemy.echo_pool = false

[loggers]
keys = sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
